<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPanel</title><link rel="stylesheet" href="/app.css"></head>
<body>
<section id="login" class="login-view">
  <form id="login-form" class="login-box"><div class="brand large"><span>M</span>Panel</div><h1>登录管理面板</h1><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><p id="login-error" class="message error hidden"></p><button class="primary full" type="submit">登录</button></form>
</section>
<div id="app" class="shell hidden">
  <header class="mobile-header"><button id="menu-button" class="icon" title="展开导航" aria-label="展开导航">☰</button><div class="brand"><span>M</span>Panel</div></header>
  <aside id="sidebar"><div class="brand desktop"><span>M</span>Panel</div><nav><button data-page="listeners" class="active">入站</button><button data-page="config">配置</button></nav><button id="logout" class="logout">退出登录</button></aside>
  <main>
    <header class="page-head"><div><h1 id="page-title">入站</h1><p id="page-subtitle">管理 listeners 配置</p></div><span id="toast" class="toast hidden"></span></header>
    <section id="page-listeners" class="page active"><div class="toolbar"><span id="listener-count">载入中</span><button id="add-listener" class="primary">＋ 新增入站</button></div><div class="table-wrap"><table><thead><tr><th>名称</th><th>类型</th><th>监听地址</th><th>端口</th><th></th></tr></thead><tbody id="listener-body"></tbody></table><div id="listener-empty" class="empty hidden">尚未配置入站</div></div></section>
    <section id="page-config" class="page"><div class="toolbar"><span>直接编辑完整 mihomo YAML</span><button id="save-config" class="primary">保存并重载</button></div><textarea id="config-editor" class="editor" spellcheck="false" aria-label="mihomo YAML 配置"></textarea><div class="backup-head"><h2>最近备份</h2><button id="refresh-backups">刷新</button></div><div id="backup-list" class="backup-list"></div></section>
  </main>
</div>
<dialog id="listener-dialog"><form id="listener-form"><header><h2 id="listener-dialog-title">新增入站</h2><button type="button" class="icon close-dialog" aria-label="关闭">×</button></header><label>名称<input name="name" required></label><div class="two"><label>类型<select name="type"><option>mixed</option><option>http</option><option>socks</option><option>shadowsocks</option><option>vmess</option><option>vless</option><option>trojan</option><option>hysteria2</option></select></label><label>端口<input name="port" type="number" min="1" max="65535" required></label></div><label>监听地址<input name="listen" value="0.0.0.0" required></label><div id="vless-section" class="vless-section hidden"><h3 class="section-title">VLESS 用户</h3><div id="vless-users" class="vless-users"></div><button type="button" id="add-vless-user" class="mini">＋ 添加用户</button><label class="check"><input type="checkbox" id="reality-enabled"> 启用 Reality</label><div id="reality-fields" class="reality-fields hidden"><label>目标地址 dest<input name="realityDest" spellcheck="false" placeholder="example.com:443"></label><label>私钥 privateKey<input name="realityPrivateKey" type="password" spellcheck="false" autocomplete="off" placeholder="Reality 私钥，仅在编辑时回显"></label><label>shortIds（每行一个）<textarea name="realityShortIds" rows="2" spellcheck="false" placeholder="123456"></textarea></label><label>serverNames（每行一个）<textarea name="realityServerNames" rows="2" spellcheck="false" placeholder="example.com"></textarea></label><label>Reality 其他高级 YAML<textarea name="realityExtraYaml" rows="3" spellcheck="false" placeholder="show: false"></textarea></label></div></div><label>其他高级 YAML<textarea name="extraYaml" rows="8" spellcheck="false" placeholder="仅需填入除 users/reality-config 外的其他字段"></textarea></label><p class="message error hidden" id="listener-error"></p><footer><button type="button" class="close-dialog">取消</button><button class="primary" type="submit">保存并重载</button></footer></form></dialog>
<dialog id="share-dialog"><form id="share-form"><header><h2>分享入站</h2><button type="button" class="icon close-dialog" aria-label="关闭">×</button></header><p id="share-name" class="share-name"></p><label>公网域名或 IP<input name="host" id="share-host" placeholder="example.com 或 1.2.3.4" spellcheck="false" required></label><p class="message error hidden" id="share-error"></p><p id="share-loading" class="share-loading hidden">载入中…</p><div id="share-list" class="share-list"></div><footer><button type="button" class="close-dialog">取消</button><button class="primary" type="submit">获取分享</button></footer></form></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title">确认操作</h2><p id="confirm-text"></p><footer><button value="cancel">取消</button><button id="confirm-button" class="danger" value="confirm">确认</button></footer></form></dialog>
<script src="/app.js" defer></script></body></html>
