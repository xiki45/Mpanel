<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPanel</title><link rel="stylesheet" href="/app.css"></head>
<body>
<section id="login" class="login-view">
  <form id="login-form" class="login-box"><div class="brand large"><span>M</span>Panel</div><h1>登录管理面板</h1><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><p id="login-error" class="message error hidden"></p><button class="primary full" type="submit">登录</button></form>
</section>
<div id="app" class="shell hidden">
  <header class="mobile-header"><button id="menu-button" class="icon" title="展开导航" aria-label="展开导航">☰</button><div class="brand"><span>M</span>Panel</div><i id="mobile-status" class="dot offline"></i></header>
  <aside id="sidebar"><div class="brand desktop"><span>M</span>Panel</div><nav><button data-page="overview" class="active">总览</button><button data-page="listeners">入站</button><button data-page="config">配置</button><button data-page="logs">日志</button></nav><button id="logout" class="logout">退出登录</button></aside>
  <main>
    <header class="page-head"><div><h1 id="page-title">总览</h1><p id="page-subtitle">mihomo 实时运行状态</p></div><span id="toast" class="toast hidden"></span></header>
    <section id="page-overview" class="page active">
      <div id="offline-banner" class="offline-banner hidden"><strong>mihomo 离线</strong><span id="offline-message">无法获取运行数据</span></div>
      <div class="status-strip"><div><small>服务状态</small><strong id="online"><i class="dot"></i>载入中</strong></div><div><small>版本</small><strong id="version">--</strong></div><div><small>运行模式</small><strong id="mode">--</strong></div><div class="actions"><button data-action="start">启动</button><button data-action="restart">重启</button><button class="danger" data-action="stop">停止</button></div></div>
      <div class="metrics"><article><small>当前上传</small><strong id="upload">--</strong></article><article><small>当前下载</small><strong id="download">--</strong></article><article><small>累计上传</small><strong id="total-upload">--</strong></article><article><small>累计下载</small><strong id="total-download">--</strong></article><article><small>内存占用</small><strong id="memory">--</strong></article><article><small>活跃连接</small><strong id="connections">--</strong></article></div>
    </section>
    <section id="page-listeners" class="page"><div class="toolbar"><span id="listener-count">载入中</span><button id="add-listener" class="primary">＋ 新增入站</button></div><div class="table-wrap"><table><thead><tr><th>名称</th><th>类型</th><th>监听地址</th><th>端口</th><th></th></tr></thead><tbody id="listener-body"></tbody></table><div id="listener-empty" class="empty hidden">尚未配置入站</div></div></section>
    <section id="page-config" class="page"><div class="toolbar"><span>直接编辑完整 mihomo YAML</span><button id="save-config" class="primary">保存并重载</button></div><textarea id="config-editor" class="editor" spellcheck="false" aria-label="mihomo YAML 配置"></textarea><div class="backup-head"><h2>最近备份</h2><button id="refresh-backups">刷新</button></div><div id="backup-list" class="backup-list"></div></section>
    <section id="page-logs" class="page"><div class="toolbar log-tools"><div><select id="log-level" aria-label="日志级别"><option value="all">全部级别</option><option value="debug">Debug</option><option value="info">Info</option><option value="warning">Warning</option><option value="error">Error</option></select><span id="log-state">正在连接</span></div><div><button id="pause-logs">暂停</button><button id="clear-logs">清空</button></div></div><div id="log-output" class="log-output"></div></section>
  </main>
</div>
<dialog id="listener-dialog"><form id="listener-form"><header><h2 id="listener-dialog-title">新增入站</h2><button type="button" class="icon close-dialog" aria-label="关闭">×</button></header><label>名称<input name="name" required></label><div class="two"><label>类型<select name="type"><option>mixed</option><option>http</option><option>socks</option><option>shadowsocks</option><option>vmess</option><option>vless</option><option>trojan</option><option>hysteria2</option></select></label><label>端口<input name="port" type="number" min="1" max="65535" required></label></div><label>监听地址<input name="listen" value="0.0.0.0" required></label><label>协议专属 YAML<textarea name="extraYaml" rows="8" spellcheck="false" placeholder="password: change-me"></textarea></label><p class="message error hidden" id="listener-error"></p><footer><button type="button" class="close-dialog">取消</button><button class="primary" type="submit">保存并重载</button></footer></form></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title">确认操作</h2><p id="confirm-text"></p><footer><button value="cancel">取消</button><button id="confirm-button" class="danger" value="confirm">确认</button></footer></form></dialog>
<script src="/app.js" defer></script></body></html>
